[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "civitai-bulk-downloader"
dynamic = ["version"]
description = "Download CivitAI models from URLs or CSV lists straight into your Stable Diffusion UI's folders"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Deepratna Awale", email = "awale.deep@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8.0",
    "aiofiles>=23.0.0",
    "tqdm>=4.60.0",
    "loguru>=0.7.0",
]
keywords = ["civitai", "stable-diffusion", "comfyui", "automatic1111", "downloader", "lora"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
civitai-download = "civitai_downloader.cli:run"
civitai-preprocess = "civitai_downloader.preprocess_cli:run"

[project.urls]
Homepage = "https://github.com/deepratna-awale/civitai-bulk-downloader"
Issues = "https://github.com/deepratna-awale/civitai-bulk-downloader/issues"

[tool.setuptools.packages.find]
include = ["civitai_downloader*"]

[tool.setuptools.package-data]
civitai_downloader = ["resources/*.json"]

[tool.setuptools.dynamic]
version = { attr = "civitai_downloader.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=civitai_downloader",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml"
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]
asyncio_mode = "auto"
